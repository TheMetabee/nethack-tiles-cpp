name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # The version comes from its `packageManager` field.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types and bundle
        run: pnpm run build
      - name: Tests
        run: pnpm test

  # The whole app, as it ships: the frontend built in, served from disk.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The CMake build runs `pnpm run build`, which needs the packages.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # The ZIP a release would ship, so a broken package rule fails here.
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package
      # A build to try from any push: unzip it and run nethack_tiles.exe. It
      # is the same set of files as the ZIP, from the same install rules.
      - name: Collect the app
        run: cmake --install build --config Release --component app --prefix nethack-tiles-windows
      - uses: actions/upload-artifact@v4
        with:
          name: nethack-tiles-windows
          path: nethack-tiles-windows
          retention-days: 14

  # Linux builds the whole app with WebKitGTK, plus the tools and tests.
  # macOS builds the libraries, tools and tests only: its app cannot serve
  # the page from disk yet. Both leave the frontend to its own job.
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (app and core)
            os: ubuntu-24.04
            app: "ON"
          - name: Core (macos-latest)
            os: macos-latest
            app: "OFF"
    steps:
      - uses: actions/checkout@v5
      # WebKitGTK, as the Rust app's CI installs for its Linux build, and
      # libsecret for the keychain. gnome-keyring is for the keychain tests.
      - name: Linux development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsecret-1-dev gnome-keyring
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DNH_BUILD_APP=${{ matrix.app }} -DNH_BUILD_FRONTEND=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure
      # The keychain tests need a Secret Service. This one is a private D-Bus
      # session with a fresh, unlocked gnome-keyring, as on a desktop after
      # login. The pause lets it make the login collection and its alias.
      - name: Tests, with a Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n ci-keyring-password | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            sleep 1
            NH_TEST_SECRET_SERVICE=1 ctest --test-dir build --output-on-failure'
