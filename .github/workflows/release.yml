name: Release

# Pushing a tag such as v0.1.0 builds the portable Windows ZIP and attaches it
# to a draft GitHub release. The release is a draft so nothing reaches anyone
# until it is published by hand, after a look at the notes and the file.
#
# The tag must match VERSION in CMakeLists.txt's project(): the ZIP's name and
# the exe's version details come from there. See "Releases" in README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

jobs:
  windows:
    name: Windows ZIP
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      # A tag that does not match the version would ship a ZIP and an exe
      # that name another version, so stop and say what to change.
      - name: Check the version
        run: |
          $version = $env:TAG -replace '^v', ''
          $zip = "build/package/nethack-tiles-$version-windows-x64.zip"
          if (-not (Test-Path $zip)) {
            $made = (Get-ChildItem build/package/*.zip).Name
            Write-Output "::error::The tag is $env:TAG, but the build made $made. Set VERSION in project() in CMakeLists.txt to $version, commit, and tag that commit."
            exit 1
          }
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Attach the ZIP to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Portable build for Windows 10 and 11 (64-bit). Unzip it anywhere and
          run `nethack_tiles.exe`; nothing is installed. Saved servers and
          passwords are kept in your user profile, so a new version in a new
          folder still finds them.

          The exe is not signed, so on the first run Windows SmartScreen asks
          to confirm: choose "More info", then "Run anyway".

          The app needs the Microsoft Edge WebView2 Runtime, which Windows 11
          and most of Windows 10 already have. If it is missing, the app says
          so and offers the download page.
          '@
          # A rerun of this workflow for the same tag replaces the file
          # instead of failing on the release that already exists.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP --draft --verify-tag `
              --title "NetHack Tiles Client $env:TAG" `
              --notes $notes --generate-notes
          }
